<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5c52e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JARVIS PLAY"><link rel="manifest" href="./manifest.webmanifest"><title>JARVIS PLAY</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#222;display:grid;place-items:center;padding:16px;font-family:ui-monospace,Menlo,monospace;color:#242424}.device{width:min(100%,390px);background:#f5c52e;border-radius:28px;padding:18px;position:relative;box-shadow:0 18px 50px #0008;border:2px solid #d7a916}.top,.bottom{display:flex;justify-content:space-between;font-size:10px;font-weight:900;letter-spacing:1px}.wrap{margin:15px 18px;background:#222;padding:10px;border-radius:12px}.screen{height:270px;background:#f1f0e8;border:2px solid #555;border-radius:5px;padding:10px;overflow:auto}.head{display:flex;justify-content:space-between;font-size:9px;font-weight:900;border-bottom:2px solid #292929;padding-bottom:5px}.view{height:calc(100% - 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.logo{font-size:30px;font-weight:1000;letter-spacing:3px}.welcome{font-size:11px;font-weight:900;line-height:1.5;margin:4px 0 10px}.menu{width:100%;display:grid;gap:4px}.item{font:900 12px ui-monospace;text-align:left;border:0;background:transparent;padding:6px 8px}.item.sel{background:#222;color:#f1f0e8}.hint,.small{font-size:10px;line-height:1.5;margin-top:8px}.controls{display:flex;justify-content:space-between;align-items:center;padding:0 18px 12px}.dpad{width:124px;height:124px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3px}.pad{border:0;background:#e5b51e;color:#8d6a09;font-size:17px;font-weight:900;box-shadow:0 3px 0 #b38b12;border-radius:8px}.up{grid-area:1/2}.left{grid-area:2/1}.mid{grid-area:2/2;border-radius:50%}.right{grid-area:2/3}.down{grid-area:3/2}.ab{display:flex;gap:12px;transform:rotate(-18deg)}.round{width:48px;height:48px;border:0;border-radius:50%;font:1000 16px ui-monospace;color:#eee;box-shadow:0 4px 0 #555}.b{background:#555;margin-top:22px}.a{background:#333;margin-bottom:22px}.action,.field{font:900 11px ui-monospace;padding:8px;border:2px solid #222;margin:4px;background:#222;color:#eee}.field{background:white;color:#222;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}.game{background:transparent;border:2px solid #222;padding:8px;font-weight:900}.crank{position:absolute;right:-10px;top:42%;width:18px;height:74px;background:linear-gradient(90deg,#888,#ddd,#777);border:2px solid #555;border-radius:7px;touch-action:none}.crank:after{content:'';display:block;width:6px;height:46px;background:#aaa;margin:10px auto;border-radius:5px}
</style></head><body><main class="device"><div class="top"><span>JARVIS PLAY</span><span id="clock">--:--</span></div><div class="wrap"><div class="screen"><div class="head"><span>J/PLAY OS</span><span>POCKET</span></div><div class="view" id="view"></div></div></div><div class="controls"><div class="dpad"><button class="pad up" data-k="up">▲</button><button class="pad left" data-k="left">◀</button><button class="pad mid" data-k="ok">●</button><button class="pad right" data-k="right">▶</button><button class="pad down" data-k="down">▼</button></div><div class="ab"><button class="round b" data-k="back">B</button><button class="round a" data-k="ok">A</button></div></div><div class="bottom"><span>◉ JARVIS MULTITOOL</span><span>v0.2</span></div><div class="crank" id="crank"></div></main>
<script>
const v=document.querySelector('#view');let page='home',sel=0,timer=null,snake=null;const pages=['games','jarvis','settings'],names=['Jogos','JARVIS Multitool','Configurações'];let ip=localStorage.getItem('jplay_ip')||'http://192.168.4.1';function clock(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,10000);
function stop(){clearInterval(timer);timer=null;snake=null}function home(){stop();page='home';sel=0;renderHome()}function renderHome(){v.innerHTML='<div class="logo">JARVIS</div><div class="welcome">MULTITOOL<br>POCKET EDITION</div><div class="menu">'+names.map((n,i)=>'<button class="item '+(i===sel?'sel':'')+'" data-i="'+i+'">▶ '+n+'</button>').join('')+'</div><div class="hint">▲▼ navega · A seleciona</div>';v.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>open(pages[+b.dataset.i]))}function open(p){stop();page=p;({games,jarvis,settings}[p])()}
function games(){v.innerHTML='<div class="logo">ARCADE</div><div class="grid"><button class="game" id="snakeBtn">▦ SNAKE<br><span class="small">Jogo da cobrinha</span></button><button class="game" id="clickBtn">◉ CLICKER<br><span class="small">Teste os botões</span></button></div><div class="hint">B volta</div>';document.querySelector('#snakeBtn').onclick=snakeGame;document.querySelector('#clickBtn').onclick=clicker}
function clicker(){let n=0;v.innerHTML='<div class="logo">BUTTON TEST</div><div id="score" style="font-size:32px;font-weight:1000">0</div><button class="action" id="plus">A +1</button><div class="hint">B volta</div>';document.querySelector('#plus').onclick=()=>document.querySelector('#score').textContent=++n}
function snakeGame(){let c=document.createElement('canvas');c.width=160;c.height=120;v.innerHTML='<div class="logo">SNAKE</div>';v.append(c);let x=c.getContext('2d'),s=[{x:5,y:5},{x:4,y:5}],d={x:1,y:0},f={x:10,y:5};snake=k=>{if(k==='up'&&d.y!==1)d={x:0,y:-1};if(k==='down'&&d.y!==-1)d={x:0,y:1};if(k==='left'&&d.x!==1)d={x:-1,y:0};if(k==='right'&&d.x!==-1)d={x:1,y:0}};timer=setInterval(()=>{let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.y<0||h.x>=20||h.y>=15||s.some(a=>a.x===h.x&&a.y===h.y)){stop();games();return}s.unshift(h);if(h.x===f.x&&h.y===f.y)f={x:Math.random()*20|0,y:Math.random()*15|0};else s.pop();x.fillStyle='#e5e4dc';x.fillRect(0,0,160,120);x.fillStyle='#222';s.forEach(a=>x.fillRect(a.x*8,a.y*8,7,7));x.fillRect(f.x*8,f.y*8,7,7)},180)}
function jarvis(){v.innerHTML='<div class="logo">JARVIS LINK</div><div class="small">Controle o ESP32-S3 pela mesma rede Wi-Fi. Configure o endereço do firmware.</div><div id="status" class="small">● Desconectado</div><button class="action" id="ping">TESTAR CONEXÃO</button><div><button class="action" data-c="status">STATUS</button><button class="action" data-c="led">LED</button><button class="action" data-c="beep">BEEP</button></div><div class="hint">Requer API correspondente no ESP32.</div>';document.querySelector('#ping').onclick=()=>req('/status','GET');v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>req('/command','POST',{command:b.dataset.c}))}
async function req(path,method='GET',body){let e=document.querySelector('#status');e.textContent='● Conectando…';try{let r=await fetch(ip.replace(/\/$/,'')+path,{method,headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});e.textContent='● '+(await r.text()).slice(0,100)}catch(e){e.textContent='● Sem resposta: confira Wi-Fi, IP e API ESP32'}}
function settings(){v.innerHTML='<div class="logo">CONFIG</div><label class="small">Endereço HTTP do ESP32</label><input class="field" id="ip" value="'+ip+'"><button class="action" id="save">SALVAR</button><div class="small">Exemplo: http://192.168.4.1<br>iPhone e ESP32 devem estar na mesma rede.</div>';document.querySelector('#save').onclick=()=>{ip=document.querySelector('#ip').value.trim();localStorage.setItem('jplay_ip',ip);alert('Endereço salvo!')}}
function key(k){if(page==='home'){if(k==='up')sel=(sel+2)%3;if(k==='down')sel=(sel+1)%3;if(k==='ok')open(pages[sel]);renderHome();return}if(k==='back'){home();return}if(page==='games'&&snake)snake(k);if(page==='jarvis'&&['up','down','left','right'].includes(k))req('/control','POST',{key:k})}document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));let crank=document.querySelector('#crank'),last=null;crank.addEventListener('touchstart',e=>last=e.touches[0].clientY,{passive:true});crank.addEventListener('touchmove',e=>{let y=e.touches[0].clientY;if(last!==null&&Math.abs(y-last)>8){key(y<last?'up':'down');last=y}},{passive:true});home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>

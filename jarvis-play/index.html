<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JARVIS PLAY"><link rel="manifest" href="./manifest.webmanifest"><title>JARVIS PLAY</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#222;display:grid;place-items:center;padding:16px;font-family:ui-monospace,Menlo,monospace;color:#242424}.device{width:min(100%,390px);background:linear-gradient(145deg,rgba(65,72,82,.72),rgba(5,7,10,.96) 48%,rgba(25,30,37,.82));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:28px;padding:18px;position:relative;box-shadow:0 22px 60px #000b,inset 0 1px 1px #ffffff55;border:2px solid rgba(210,220,230,.42)}.top,.bottom{display:flex;justify-content:space-between;font-size:10px;font-weight:900;letter-spacing:1px}.wrap{margin:15px 18px;background:#222;padding:10px;border-radius:12px}.screen{height:320px;background:var(--paper,#f1f0e8);border:2px solid #555;border-radius:5px;padding:10px;overflow:auto}.head{display:flex;justify-content:space-between;font-size:9px;font-weight:900;border-bottom:2px solid #292929;padding-bottom:5px}.view{min-height:calc(100% - 20px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.logo{font-size:27px;font-weight:1000;letter-spacing:3px}.welcome{font-size:11px;font-weight:900;line-height:1.5;margin:4px 0 10px}.menu{width:100%;display:grid;gap:4px}.item{font:900 12px ui-monospace;text-align:left;border:0;background:transparent;padding:6px 8px;color:#222}.item.sel{background:#222;color:#f1f0e8}.hint,.small{font-size:10px;line-height:1.5;margin-top:8px}.controls{display:flex;justify-content:space-between;align-items:center;padding:0 18px 12px}.dpad{width:124px;height:124px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3px}.pad{border:1px solid #aab2bc;background:linear-gradient(145deg,rgba(75,82,91,.88),rgba(20,23,28,.94));color:#e6ebf0;font-size:17px;font-weight:900;box-shadow:0 3px 0 #090b0e,inset 0 1px 1px #ffffff35;border-radius:8px;touch-action:manipulation}.up{grid-area:1/2}.left{grid-area:2/1}.mid{grid-area:2/2;border-radius:50%}.right{grid-area:2/3}.down{grid-area:3/2}.ab{display:flex;gap:12px;transform:rotate(-18deg)}.round{width:48px;height:48px;border:1px solid #aab2bc;border-radius:50%;font:1000 16px ui-monospace;color:#f4f6f8;background:linear-gradient(145deg,rgba(95,103,113,.9),rgba(14,17,21,.95));box-shadow:0 4px 0 #080a0c,inset 0 1px 1px #ffffff45;touch-action:manipulation}.b{background:#555;margin-top:22px}.a{background:#333;margin-bottom:22px}.action,.field,.select{font:900 11px ui-monospace;padding:8px;border:2px solid #222;margin:4px;background:#222;color:#eee;border-radius:3px}.field,.select{background:white;color:#222;width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}.game{background:transparent;border:2px solid #222;padding:9px;font-weight:900;color:#222}.rowline{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border-bottom:1px dotted #777;padding:6px 0;font-size:10px;text-align:left}.rowline input{accent-color:#222}.pill{font-size:9px;border:1px solid #222;padding:3px 5px}.crank{position:absolute;right:-10px;top:42%;width:18px;height:74px;background:linear-gradient(90deg,#888,#ddd,#777);border:2px solid #555;border-radius:7px;touch-action:none}.crank:after{content:'';display:block;width:6px;height:46px;background:#aaa;margin:10px auto;border-radius:5px}canvas{background:#e5e4dc;border:2px solid #222;image-rendering:pixelated;max-width:100%}.meter{height:8px;border:1px solid #222;width:100%;margin:5px 0}.meter span{display:block;height:100%;background:#222}.muted{opacity:.7}
</style></head><body><main class="device"><div class="top"><span>JARVIS PLAY</span><span id="clock">--:--</span></div><div class="wrap"><div class="screen"><div class="head"><span>J/PLAY OS</span><span id="syslabel">POCKET</span></div><div class="view" id="view"></div></div></div><div class="controls"><div class="dpad"><button class="pad up" data-k="up">▲</button><button class="pad left" data-k="left">◀</button><button class="pad mid" data-k="ok">●</button><button class="pad right" data-k="right">▶</button><button class="pad down" data-k="down">▼</button></div><div class="ab"><button class="round b" data-k="back">B</button><button class="round a" data-k="ok">A</button></div></div><div class="bottom"><span>◉ JARVIS MULTITOOL</span><span>v0.3</span></div><div class="crank" id="crank"></div></main>
<script>
const v=document.querySelector('#view');let page='home',sel=0,timer=null,snakeMove=null,memSeq=[],memInput=[],reactionStart=0,reactionTimer=null;
const menu=[['games','Jogos'],['ai','JARVIS IA'],['device','Configurações do aparelho'],['multi','Configurações Multitool'],['link','Conexão ESP32-S3']];
const defaults={sound:true,haptic:true,contrast:false,crank:true,theme:'dark',brightness:100,wifi:true,bluetooth:true,nfc:true,rfid:true,infrared:true,subghz:false,gpio:true,antennas:'external',espDark:true};
let cfg={...defaults,...JSON.parse(localStorage.getItem('jplay_cfg')||'{}')};
let ip=localStorage.getItem('jplay_ip')||'http://192.168.4.1';
const modules=[['wifi','Wi-Fi'],['bluetooth','Bluetooth'],['nfc','NFC'],['rfid','RFID 125 kHz'],['infrared','Infravermelho'],['subghz','Sub-GHz'],['gpio','GPIO / sensores']];
function saveCfg(){localStorage.setItem('jplay_cfg',JSON.stringify(cfg));applyLook()}
function applyLook(){document.documentElement.style.setProperty('--yellow','#111318');document.documentElement.style.setProperty('--paper',cfg.espDark?'#171a20':(cfg.contrast?'#fff':'#f1f0e8'));document.querySelector('.screen').style.filter='brightness('+(Number(cfg.brightness||100)/100)+')';document.querySelector('.device').style.filter=cfg.contrast?'contrast(1.12)':'';document.querySelector('#syslabel').textContent='BLACK EDITION'}
function clock(){document.querySelector('#clock').textContent=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}clock();setInterval(clock,10000);applyLook();
function stop(){clearInterval(timer);clearTimeout(reactionTimer);timer=null;reactionTimer=null;snakeMove=null}
function home(){stop();page='home';sel=0;renderHome()}
function renderHome(){v.innerHTML='<div class="logo">JARVIS</div><div class="welcome">MULTITOOL<br>POCKET EDITION</div><div class="menu">'+menu.map((n,i)=>'<button class="item '+(i===sel?'sel':'')+'" data-i="'+i+'">▶ '+n[1]+'</button>').join('')+'</div><div class="hint">▲▼ navega · A seleciona</div>';v.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>open(menu[+b.dataset.i][0]))}
function open(p){stop();page=p;const screens={games,ai:aiScreen,device:deviceSettings,multi:multiSettings,link:linkSettings};if(screens[p])screens[p]();else home()}
function games(){v.innerHTML='<div class="logo">ARCADE</div><div class="grid"><button class="game" id="snakeBtn">▦ SNAKE<br><span class="small">Cobrinha</span></button><button class="game" id="memoryBtn">▣ MEMÓRIA<br><span class="small">Sequência</span></button><button class="game" id="reactBtn">◷ REFLEXO<br><span class="small">Teste de reação</span></button><button class="game" id="clickBtn">◉ CLICKER<br><span class="small">Teste A/B</span></button></div><div class="hint">B volta ao menu</div>';document.querySelector('#snakeBtn').onclick=snakeGame;document.querySelector('#memoryBtn').onclick=memoryGame;document.querySelector('#reactBtn').onclick=reactionGame;document.querySelector('#clickBtn').onclick=clicker}
function aiScreen(){v.innerHTML='<div class="logo">JARVIS AI</div><div style="width:100%;display:flex;justify-content:center;margin:4px 0"><svg viewBox="0 0 180 130" width="155" role="img" aria-label="Mascote relógio retrô translúcido"><defs><linearGradient id="glass" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#b8f4e8" stop-opacity=".78"/><stop offset=".55" stop-color="#78c9c0" stop-opacity=".38"/><stop offset="1" stop-color="#e8fff8" stop-opacity=".7"/></linearGradient></defs><path d="M82 8h16v13H82zM82 109h16v13H82z" fill="#9bd8cf" fill-opacity=".8"/><circle cx="90" cy="65" r="49" fill="url(#glass)" stroke="#4f8f8a" stroke-width="3"/><circle cx="90" cy="65" r="39" fill="#f4e6c8" fill-opacity=".35" stroke="#fff" stroke-opacity=".7"/><path d="M90 65V38M90 65l22 13" stroke="#244c4a" stroke-width="4" stroke-linecap="round"/><circle cx="90" cy="65" r="4" fill="#244c4a"/><path d="M70 83q20 13 40 0" fill="none" stroke="#244c4a" stroke-width="2.5" stroke-linecap="round"/><circle cx="73" cy="66" r="3" fill="#244c4a"/><circle cx="107" cy="66" r="3" fill="#244c4a"/><path d="M42 44l-9-6M138 44l9-6" stroke="#b9eee4" stroke-width="4" stroke-linecap="round"/></svg></div><div class="welcome">Olá! Sou a assistente JARVIS.<br>Estética futurista retrô · anos 70</div><div id="aiLog" class="small" style="width:100%;min-height:42px">Estou em modo demonstração local. Conecte a API para conversar com uma IA real.</div><input class="field" id="aiInput" placeholder="Digite uma mensagem..."><button class="action" id="aiSend">ENVIAR</button><div class="hint">Mascote original de relógio translúcido, inspirado no design retrofuturista.</div>';document.querySelector('#aiSend').onclick=()=>{let q=document.querySelector('#aiInput').value.trim();if(!q)return;document.querySelector('#aiLog').textContent='Você: '+q+' | JARVIS: Estou pronta. Para responder com inteligência real, preciso estar conectada ao servidor JARVIS.';document.querySelector('#aiInput').value='';feedback()}}\nfunction clicker(){let n=0;v.innerHTML='<div class="logo">BUTTON TEST</div><div id="score" style="font-size:36px;font-weight:1000">0</div><div class="small">Toque A ou no botão abaixo</div><button class="action" id="plus">A +1</button><div class="hint">B volta</div>';document.querySelector('#plus').onclick=()=>{n++;document.querySelector('#score').textContent=n;feedback()}}
function snakeGame(){let c=document.createElement('canvas');c.width=192;c.height=144;v.innerHTML='<div class="logo">SNAKE</div><div class="small">Use as setas · B sai</div>';v.append(c);let x=c.getContext('2d'),s=[{x:5,y:5},{x:4,y:5}],d={x:1,y:0},f={x:10,y:5},score=0;snakeMove=k=>{if(k==='up'&&d.y!==1)d={x:0,y:-1};if(k==='down'&&d.y!==-1)d={x:0,y:1};if(k==='left'&&d.x!==1)d={x:-1,y:0};if(k==='right'&&d.x!==-1)d={x:1,y:0}};timer=setInterval(()=>{let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.y<0||h.x>=24||h.y>=18||s.some(a=>a.x===h.x&&a.y===h.y)){stop();v.innerHTML='<div class="logo">FIM DE JOGO</div><div class="small">Pontuação: '+score+'</div><button class="action" id="again">JOGAR NOVAMENTE</button>';document.querySelector('#again').onclick=snakeGame;return}s.unshift(h);if(h.x===f.x&&h.y===f.y){score++;f={x:Math.random()*24|0,y:Math.random()*18|0}}else s.pop();x.fillStyle='#e5e4dc';x.fillRect(0,0,192,144);x.fillStyle='#222';s.forEach(a=>x.fillRect(a.x*8,a.y*8,7,7));x.fillRect(f.x*8,f.y*8,7,7);x.font='9px monospace';x.fillText('PTS '+score,3,10)},160)}
function memoryGame(){memSeq=[];memInput=[];let round=0;v.innerHTML='<div class="logo">MEMÓRIA</div><div id="round" class="small">Repita a sequência de setas</div><div class="grid"><button class="game" data-m="up">▲</button><button class="game" data-m="right">▶</button><button class="game" data-m="left">◀</button><button class="game" data-m="down">▼</button></div><button class="action" id="startMem">COMEÇAR</button>';v.querySelector('#startMem').onclick=next;v.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{if(!memSeq.length)return;memInput.push(b.dataset.m);if(memInput[memInput.length-1]!==memSeq[memInput.length-1]){v.querySelector('#round').textContent='Errou! Rodada alcançada: '+round;memSeq=[];return}if(memInput.length===memSeq.length){round++;v.querySelector('#round').textContent='Muito bem! Rodada '+round;setTimeout(next,500)}});function next(){memSeq.push(['up','down','left','right'][Math.random()*4|0]);memInput=[];v.querySelector('#round').textContent='Rodada '+(round+1)+' · sequência de '+memSeq.length;let i=0;function show(){if(i<memSeq.length){let b=v.querySelector('[data-m="'+memSeq[i++]+'"]');if(b){b.style.background='#222';b.style.color='#fff';setTimeout(()=>{b.style.background='';b.style.color='#222';setTimeout(show,180)},300)}}}show()}}
function reactionGame(){v.innerHTML='<div class="logo">REFLEXO</div><div id="reactText" class="small">Toque em INICIAR e espere a tela mudar.</div><button class="action" id="reactBtn">INICIAR</button>';let ready=false;document.querySelector('#reactBtn').onclick=()=>{if(ready){let ms=Math.round(performance.now()-reactionStart);ready=false;clearTimeout(reactionTimer);document.querySelector('#reactText').textContent='Seu tempo: '+ms+' ms';document.querySelector('#reactBtn').textContent='TENTAR NOVAMENTE';return}document.querySelector('#reactText').textContent='Aguarde…';document.querySelector('#reactBtn').textContent='NÃO TOQUE';reactionTimer=setTimeout(()=>{ready=true;reactionStart=performance.now();document.querySelector('#reactText').textContent='AGORA!';document.querySelector('#reactBtn').textContent='TOCAR!'},1000+Math.random()*2500)}}
function feedback(){if(cfg.haptic&&navigator.vibrate)navigator.vibrate(15);if(cfg.sound){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.035;o.start();o.stop(a.currentTime+.045);o.onended=()=>a.close()}catch(e){}}}
function deviceSettings(){v.innerHTML='<div class="logo">APARELHO</div><div class="rowline">Brilho da tela <b id="brightVal">'+cfg.brightness+'%</b></div><input class="field" type="range" min="25" max="100" step="5" id="brightness" value="'+cfg.brightness+'"><div class="rowline">Som da interface <input type="checkbox" id="sound" '+(cfg.sound?'checked':'')+'></div><div class="rowline">Vibração (se suportada) <input type="checkbox" id="haptic" '+(cfg.haptic?'checked':'')+'></div><div class="rowline">Alto contraste <input type="checkbox" id="contrast" '+(cfg.contrast?'checked':'')+'></div><div class="rowline">Manivela por gesto <input type="checkbox" id="crank" '+(cfg.crank?'checked':'')+'></div><label class="small">Tema</label><select class="select" id="theme"><option value="yellow">Amarelo Playdate</option><option value="cream">Creme</option><option value="dark">Cinza retrô</option></select><button class="action" id="saveDevice">SALVAR</button><button class="action" id="resetDevice">RESTAURAR PADRÃO</button><div class="small muted">Preferências salvas somente neste iPhone. O iOS limita acesso a brilho, volume e vibração em páginas web.</div>';document.querySelector('#theme').value=cfg.theme;document.querySelector('#brightness').oninput=e=>{cfg.brightness=+e.target.value;document.querySelector('#brightVal').textContent=cfg.brightness+'%';applyLook()};document.querySelector('#saveDevice').onclick=()=>{['sound','haptic','contrast','crank'].forEach(k=>cfg[k]=document.querySelector('#'+k).checked);cfg.theme=document.querySelector('#theme').value;saveCfg();feedback();deviceSettings()};document.querySelector('#resetDevice').onclick=()=>{cfg={...defaults};saveCfg();deviceSettings()}}
function multiSettings(){v.innerHTML='<div class="logo">MULTITOOL</div><div class="small">Ative os módulos que existem no seu hardware. Isso salva preferências; não liga rádios nem módulos por si só.</div>'+modules.map(([k,n])=>'<div class="rowline">'+n+' <input type="checkbox" id="m_'+k+'" '+(cfg[k]?'checked':'')+'></div>').join('')+'<label class="small">Antenas</label><select class="select" id="ant"><option value="external">Externas removíveis · SMA</option><option value="internal">Internas</option><option value="none">Não configuradas</option></select><button class="action" id="saveMulti">SALVAR MÓDULOS</button><button class="action" id="sendMulti">ENVIAR AO ESP32</button><div id="multiMsg" class="small">Configuração local aguardando envio.</div>';document.querySelector('#ant').value=cfg.antennas;document.querySelector('#saveMulti').onclick=()=>{modules.forEach(([k])=>cfg[k]=document.querySelector('#m_'+k).checked);cfg.antennas=document.querySelector('#ant').value;saveCfg();document.querySelector('#multiMsg').textContent='Preferências salvas neste iPhone.'};document.querySelector('#sendMulti').onclick=async()=>{modules.forEach(([k])=>cfg[k]=document.querySelector('#m_'+k).checked);cfg.antennas=document.querySelector('#ant').value;saveCfg();await req('/config/modules','POST',{modules:Object.fromEntries(modules.map(([k])=>[k,cfg[k]])),antennas:cfg.antennas},'multiMsg')}}
function linkSettings(){v.innerHTML='<div class="logo">ESP32-S3 LINK</div><div class="rowline">Tema escuro do painel <input type="checkbox" id="espDark" '+(cfg.espDark?'checked':'')+'></div><div class="small">PAINEL DE CONTROLE · funções previstas para quando os módulos estiverem conectados</div><div class="grid">'+[['wifi','Wi-Fi'],['bluetooth','Bluetooth'],['nfc','NFC'],['rfid','RFID'],['infrared','IR'],['subghz','Sub-GHz'],['gpio','GPIO']].map(([k,n])=>'<button class="game" data-feature="'+k+'">'+n+'<br><small>'+(cfg[k]?'ATIVAR / CONFIGURAR':'DESATIVADO')+'</small></button>').join('')+'</div><div class="small">Endereço HTTP local do JARVIS MULTITOOL</div><input class="field" id="ip" value="'+ip+'"><button class="action" id="saveIp">SALVAR IP</button><button class="action" id="ping">TESTAR /status</button><div id="status" class="small">● Desconectado</div><div class="small muted">iPhone e ESP32 devem estar na mesma rede Wi-Fi. O firmware precisa implementar as rotas chamadas pelo app.</div>';document.querySelector('#espDark').onchange=e=>{cfg.espDark=e.target.checked;saveCfg();linkSettings()};v.querySelectorAll('[data-feature]').forEach(b=>b.onclick=()=>{let k=b.dataset.feature;cfg[k]=!cfg[k];saveCfg();linkSettings()});document.querySelector('#saveIp').onclick=()=>{ip=document.querySelector('#ip').value.trim().replace(/\/$/,'');localStorage.setItem('jplay_ip',ip);document.querySelector('#status').textContent='Endereço salvo.'};document.querySelector('#ping').onclick=()=>req('/status','GET',null,'status')}
async function req(path,method='GET',body,target='status'){let e=document.getElementById(target);if(e)e.textContent='● Conectando…';try{let r=await fetch(ip.replace(/\/$/,'')+path,{method,headers:{'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});let t=await r.text();if(e)e.textContent=(r.ok?'● ':'● HTTP '+r.status+' · ')+t.slice(0,140)}catch(err){if(e)e.textContent='● Sem resposta. Confira IP, Wi-Fi e se o firmware oferece esta rota.'}}
function key(k){feedback();if(page==='home'){if(k==='up')sel=(sel+menu.length-1)%menu.length;if(k==='down')sel=(sel+1)%menu.length;if(k==='ok'){open(menu[sel][0]);return}renderHome();return}if(k==='back'){home();return}if(page==='games'&&snakeMove)snakeMove(k);if(page==='link'&&['up','down','left','right'].includes(k))req('/control','POST',{key:k})}
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>key(b.dataset.k));let crank=document.querySelector('#crank'),last=null;crank.addEventListener('touchstart',e=>last=e.touches[0].clientY,{passive:true});crank.addEventListener('touchmove',e=>{if(!cfg.crank)return;let y=e.touches[0].clientY;if(last!==null&&Math.abs(y-last)>8){key(y<last?'up':'down');last=y}},{passive:true});home();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=5').catch(()=>{});
</script></body></html>
